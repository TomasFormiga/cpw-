<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscrição - Clube de Desporto</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>
    <header>
        <h1>Clube de Desporto</h1>
        <nav aria-label="Navegação principal">
            <a href="../index.html">Início</a>
            <a href="atividades.html">Atividades</a>
            <a href="inscricao.html">Inscrição</a>
        </nav>
    </header>

    <main>
        <h2>Inscreve-te no Clube de Desporto</h2>
        <p>Preenche o formulário abaixo para participar nas nossas atividades e oficinas.</p>

        <form action="#" method="post">
            <div class="campo">
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required>
            </div>

            <div class="campo">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="campo">
                <label for="oficina">Oficina</label>
                <select id="oficina" name="oficina" required>
                    <option value="">Escolha uma opção</option>
                    <option value="futebol">Futebol</option>
                    <option value="basquetebol">Basquetebol</option>
                    <option value="robotica">Robótica</option>
                </select>
            </div>

            <div class="campo">
                <label for="mensagem">Mensagem (opcional)</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreve uma mensagem para a organização..."></textarea>
            </div>

            <button type="submit">Enviar inscrição</button>
        </form>
    </main>

    <footer>
        <p>© 2026 Clube de Desporto</p>
    </footer>
</body>
</html>
